name: yalla_events
description: Official admission companion for Arab Kulturfestival. Online-only ticket validation against AKF Tickets WordPress backend.
publish_to: "none"
version: 1.0.1+7

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.5.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  vibration: ^3.2.1
  printing: ^5.15.1
  pdf: ^3.13.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
