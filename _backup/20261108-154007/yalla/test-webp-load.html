<!doctype html><html><head><meta charset="utf-8"></head><body>
<img id="test" src="https://arab-kulturfestival.de/wp-content/themes/yalla/assets/img/logo-mark.webp" alt="test" />
<script>
const img = document.getElementById('test');
img.onload = () => console.log('LOADED:', img.naturalWidth, 'x', img.naturalHeight);
img.onerror = (e) => console.log('ERROR:', e?.message || 'unknown');
setTimeout(() => console.log('AFTER 3s: complete=' + img.complete + ' w=' + img.naturalWidth), 3000);
</script>
</body></html>
