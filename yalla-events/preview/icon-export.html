<!doctype html>
<meta charset="utf-8">
<title>export icons</title>
<script>
const icons = {
  cal: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><g fill="none" stroke="#402315" stroke-width="3.2" stroke-linejoin="round"><rect x="5" y="12" width="46" height="39" rx="2"/><path d="M5 24 H51"/><path d="M17 6 V17 M39 6 V17"/><g fill="#402315" stroke="none"><rect x="12" y="30" width="7" height="7"/><rect x="24" y="30" width="7" height="7"/><rect x="36" y="30" width="7" height="7"/><rect x="12" y="41" width="7" height="7"/><rect x="24" y="41" width="7" height="7"/><rect x="36" y="41" width="7" height="7"/></g></g></svg>`,
  people: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><g fill="#402315"><circle cx="28" cy="16" r="9"/><path d="M8 48 C8 34 18 28 28 28 C38 28 48 34 48 48 Z"/><circle cx="9" cy="24" r="5"/><circle cx="47" cy="24" r="5"/></g></svg>`,
  pin: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56"><path d="M24 2 C11 2 2 11 2 24 C2 39 24 54 24 54 C24 54 46 39 46 24 C46 11 37 2 24 2 Z" fill="#402315"/><circle cx="24" cy="23" r="9" fill="#F8F0DF"/></svg>`
};
window.makeIcon = (key) => {
  const svg = icons[key];
  const w = key === 'pin' ? 48 : 56;
  const h = key === 'pin' ? 56 : 56;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = w*4; c.height = h*4;
      const ctx = c.getContext('2d');
      ctx.scale(4,4);
      ctx.drawImage(img,0,0,w,h);
      res(c.toDataURL('image/png'));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
};
window.ready = true;
</script>
