<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<title>Arab Kulturfestival — Eintrittskarte</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Noto+Sans+Arabic:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#1b1b1b;overflow:hidden}
  #stage{
    position:absolute;left:50%;top:50%;width:1620px;height:971px;
    transform-origin:center center;transform:translate(-50%,-50%) scale(var(--s,1));
    background:#FFF4DF;overflow:hidden;
    font-family:'Montserrat',Arial,sans-serif;
  }
  .abs{position:absolute}
  /* ---------- PATTERN (islamic geometric), left side + top, fading ---------- */
  #pattern{position:absolute;left:0;top:0;width:760px;height:700px;pointer-events:none;object-fit:fill}

  /* ---------- HEADER ---------- */
  #vline{position:absolute;left:558px;top:44px;width:3px;height:176px;background:#402315}
  #festLogo{position:absolute;left:70px;top:34px;width:430px;height:auto;object-fit:contain}
  #title{position:absolute;left:610px;top:72px;width:470px;text-align:center;font-size:62px;font-weight:800;color:#402315;letter-spacing:-1.5px}
  #subtitle{position:absolute;left:600px;top:150px;width:470px;text-align:center;font-size:36px;font-weight:700;color:#A52B2B}

  /* Oriental Band Hamburg logo */
  #obLogo{position:absolute;right:44px;top:64px;width:300px;height:120px}
  #obLogo .dia{position:absolute;left:0;top:18px;width:74px;height:74px;transform:rotate(45deg);background:#9A6B22;border:3px solid #C99A45}
  #obLogo .dia svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-45deg)}
  #obLogo .ob1{position:absolute;left:74px;top:6px;font-family:'Great Vibes',cursive;font-size:70px;color:#402315;line-height:1}
  #obLogo .ob2{position:absolute;left:150px;top:80px;font-size:22px;font-weight:700;font-style:italic;color:#402315;letter-spacing:1px}

  #hline{position:absolute;left:0;top:247px;width:100%;height:10px;background:#402315}

  /* ---------- LEFT BODY ---------- */
  #dashed{position:absolute;left:445px;top:258px;width:2px;height:552px;
    background:repeating-linear-gradient(to bottom,#C99A45 0,#C99A45 8px,transparent 8px,transparent 16px)}
  #qrFrame{position:absolute;left:105px;top:312px;width:296px;height:296px;background:#fff;
    border:6px solid #C99A45;border-radius:14px;box-sizing:border-box;padding:22px;display:flex;align-items:center;justify-content:center}
  #qrCanvas{width:240px;height:240px;display:block}
  #qrCanvas img,#qrCanvas canvas{width:240px!important;height:240px!important}
  #skyline{position:absolute;left:0;top:606px;width:447px;height:234px}
  #skyline img{width:100%;height:100%;display:block}

  /* ---------- RIGHT BODY ---------- */
  .lbl{position:absolute;left:495px;font-size:30px;font-weight:600;color:#402315}
  .val{position:absolute;left:495px;font-weight:800;color:#402315}
  #lTicket{top:292px} #vTicket{top:326px;font-size:60px;color:#A52B2B;letter-spacing:-1px}
  #lName{top:420px}  #vName{top:452px;font-size:40px}
  #lEvent{top:534px} #vEvent{top:566px;font-size:36px}
  #calIcon{position:absolute;left:495px;top:660px;width:56px;height:56px}
  #lDate{position:absolute;left:572px;top:656px;font-size:30px;font-weight:600;color:#402315}
  #vDate{position:absolute;left:572px;top:694px;font-size:31px;font-weight:800;color:#402315}
  #vSep{position:absolute;left:1010px;top:650px;width:2px;height:92px;background:#C9AB86}
  #pIcon{position:absolute;left:1052px;top:660px;width:56px;height:56px}
  #lPers{position:absolute;left:1124px;top:656px;font-size:30px;font-weight:600;color:#402315}
  #vPers{position:absolute;left:1124px;top:694px;font-size:40px;font-weight:800;color:#402315}
  #pinIcon{position:absolute;left:495px;top:762px;width:48px;height:56px}
  #lOrt{position:absolute;left:572px;top:758px;font-size:30px;font-weight:600;color:#402315}
  #vOrt{position:absolute;left:572px;top:794px;font-size:26px;font-weight:800;color:#402315;white-space:nowrap}

  /* Barcode (horizontal code39 rotated to vertical) */
  #barWrap{position:absolute;left:1462px;top:278px;width:110px;height:500px;overflow:hidden}
  #barRot{position:absolute;left:-195px;top:195px;width:500px;height:110px;transform:rotate(90deg);transform-origin:center}
  #barcode{width:500px;height:110px}

  /* ---------- FOOTER WAVES ---------- */
  #waves{position:absolute;left:0;top:838px;width:1620px;height:133px}
  #waves img{width:100%;height:100%;display:block}
  #footText{position:absolute;right:88px;top:912px;font-family:'Great Vibes',cursive;font-size:34px;color:#FFF4DF;transform:rotate(-4deg)}
</style>
</head>
<body>
<div id="stage">

  <!-- Islamic pattern (exact from reference) -->
  <img id="pattern" src="ticket-pattern.png" alt="">

  <!-- Header -->
  <img id="festLogo" src="akf-logo-brown.png" alt="Arab Kulturfestival — مهرجان الثقافة العربية">
  <div id="vline"></div>
  <div id="title">Eintrittskarte</div>
  <div id="subtitle">Arab Kulturfestival</div>

  <div id="obLogo">
    <div class="dia">
      <svg viewBox="0 0 74 74"><g fill="none" stroke="#E8C884" stroke-width="2">
        <path d="M5 5 L69 69 M69 5 L5 69 M37 2 L37 72 M2 37 L72 37"/>
        <rect x="20" y="20" width="34" height="34" transform="rotate(45 37 37)"/>
      </g></svg>
    </div>
    <div class="ob1">Oriental</div>
    <div class="ob2">Band Hamburg</div>
  </div>

  <div id="hline"></div>

  <!-- Left body -->
  <div id="dashed"></div>
  <div id="qrFrame"><div id="qrCanvas"></div></div>

  <div id="skyline"><img src="ticket-skyline.png" alt="Hamburg skyline"></div>

  <!-- Right body data -->
  <div class="lbl" id="lTicket">Ticket-Nummer</div>
  <div class="val" id="vTicket">AKF-2026-000123</div>
  <div class="lbl" id="lName">Name</div>
  <div class="val" id="vName">Ahmad Alzaher</div>
  <div class="lbl" id="lEvent">Veranstaltung</div>
  <div class="val" id="vEvent">Einladung zur Jahresabschlussfeier 2026</div>

  <svg id="calIcon" viewBox="0 0 56 56">
    <g fill="none" stroke="#402315" stroke-width="3.2" stroke-linejoin="round">
      <rect x="5" y="12" width="46" height="39" rx="2"/>
      <path d="M5 24 H51"/>
      <path d="M17 6 V17 M39 6 V17"/>
      <g fill="#402315" stroke="none">
        <rect x="12" y="30" width="7" height="7"/><rect x="24" y="30" width="7" height="7"/><rect x="36" y="30" width="7" height="7"/>
        <rect x="12" y="41" width="7" height="7"/><rect x="24" y="41" width="7" height="7"/><rect x="36" y="41" width="7" height="7"/>
      </g>
    </g>
  </svg>
  <div id="lDate">Datum / Uhrzeit</div>
  <div id="vDate">04.12.2026&nbsp; 18:00 - 21:00</div>
  <div id="vSep"></div>

  <svg id="pIcon" viewBox="0 0 56 56">
    <g fill="#402315">
      <circle cx="28" cy="16" r="9"/>
      <path d="M8 48 C8 34 18 28 28 28 C38 28 48 34 48 48 Z"/>
      <circle cx="9" cy="24" r="5"/><circle cx="47" cy="24" r="5"/>
    </g>
  </svg>
  <div id="lPers">Personen</div>
  <div id="vPers">2</div>

  <svg id="pinIcon" viewBox="0 0 48 56">
    <path d="M24 2 C11 2 2 11 2 24 C2 39 24 54 24 54 C24 54 46 39 46 24 C46 11 37 2 24 2 Z" fill="#402315"/>
    <circle cx="24" cy="23" r="9" fill="#FFF4DF"/>
  </svg>
  <div id="lOrt">Ort</div>
  <div id="vOrt">Gemeinde St. Markus, Heider Str. 1, 20251 Hamburg-Nord</div>

  <!-- Barcode -->
  <div id="barWrap"><div id="barRot"><svg id="barcode"></svg></div></div>

  <!-- Footer waves (exact from reference) -->
  <div id="waves"><img src="ticket-waves.png" alt="Decorative waves"></div>

</div>

<script>
  // Scale the fixed 1620x971 design to fit the viewport.
  function fit(){
    const s = Math.min(window.innerWidth/1620, window.innerHeight/971);
    document.getElementById('stage').style.setProperty('--s', s);
  }
  window.addEventListener('resize', fit); fit();

  // Real QR code pointing to the verification URL.
  const verifyUrl = 'https://arab-kulturfestival.de/ticket/verify?code=AKF-2026-000123-SECURETOKEN';
  if (window.QRCode) {
    new QRCode(document.getElementById('qrCanvas'), {
      text: verifyUrl, width: 240, height: 240, colorDark:'#1A1A1A', colorLight:'#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  // Real Code39 barcode for the ticket number, rotated to vertical via CSS.
  if (window.JsBarcode) {
    try {
      JsBarcode('#barcode', 'AKF2026000123', {
        format:'CODE39', displayValue:false, lineColor:'#402315', width:3, height:110, margin:0
      });
    } catch(e){}
  }
</script>
</body>
</html>
