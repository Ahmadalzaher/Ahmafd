<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8"><title>Arab Kulturfestival — Eintrittskarte</title>
<style>
  html,body{margin:0;padding:0;background:#000}
  .ticket{width:1440px;height:864px;position:relative;font-family:"Montserrat",sans-serif;overflow:hidden;display:flex;flex-direction:column;background:#F5E6BE}
  .top{height:30%;background:#231300;display:flex;align-items:center;justify-content:space-between;padding:20px 40px;color:#fff;border-bottom:1px solid #B78800}
  .top .brand{font-weight:900;font-size:32px;letter-spacing:1px}
  .top .title{font-weight:900;font-size:64px;color:#F5E6BE;margin:0 auto}
  .top .badge{border:1px solid #B78800;padding:8px 14px;color:#B78800;font-weight:700;font-size:16px;letter-spacing:.5px}
  .mid{display:flex;flex:1}
  .qr{position:absolute;left:4%;top:12%;width:72%;height:68%;background:#fff;border:1px solid #B78800;border-radius:10px;box-shadow:0 0 20px rgba(183,136,0,.25)}
  .right{position:absolute;right:5%;top:10%;width:30%;padding:60px 20px;color:#231300}
  .right h3{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:0 0 18px}
  .right .val{font-size:34px;font-weight:900;color:#7C1F1F;line-height:1.2}
  .right .sml{font-size:12px;opacity:.7;margin:6px 0}
  .right .sml b{color:#231300;font-weight:800}
  .bottom{height:20%;background:#B78800;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:28px;gap:20px}
  .waves{position:absolute;left:0;right:0;bottom:0;height:12vh;display:flex;align-items:flex-end}
  .waves span{flex:1;position:relative;height:100%;background:#B78800;animation:floating waves infinite ease-in-out;color:#F5E6BE;font-size:8px;display:flex;align-items:flex-end;justify-content:flex-start;padding:4px;font-weight:800;font-style:italic}
  .waves .g{background:#EBD578;color:#231300}
  @keyframes waves{0%,100%{height:20%}50%{height:60%}}
</style>
</head>
<body>
<div class="ticket">
  <div class="top">
    <div><div class="brand">Arab Kulturfestival</div></div>
    <div class="title">Eintrittskarte</div>
    <div class="badge">Oriental Band Hamburg</div>
  </div>
  <div class="qr"></div>
  <div class="right">
    <h3>AKF-2026-000123</h3><div class="val">000123</div><div class="sml">Name: <b>Ahmad Alzaher</b></div>
    <div class="sml">Einladung zur Jahresabschlussfeier 2026</div>
    <div class="sml">04.12.2026 · 18:00 – 21:00</div>
    <div class="sml">Gemeinde St. Markus, Heider Str. 1, 20251 Hamburg-Nord</div>
  </div>
  <div class="waves"><span>G</span><span class="g">S</span><span>I</span><span class="g">F</span><span>F</span><span class="g">T</span><span>I</span><span>E</span><span class="g">N</span><span>R</span></div>
</div>
</body>
</html>
