<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<title>Ticket — Arab Kulturfestival</title>
<style>
  body{margin:0;padding:0}
  .ticket{width:100%;max-width:1280px;aspect-ratio:4.94/3;position:relative;font-family:"Montserrat","Segoe UI",sans-serif;border:1px solid #c0a05a}
  :root{--cream:#F5E8C2;--brown:#231300;--burg:#7c1f1f;--gold:#c19a33;--light:#1f9d8f}
  .ticket{background:var(--cream);overflow:hidden}
  .top{height:27%;background:var(--cream);border-bottom:2px solid var(--brown);display:grid;grid-template-columns:1fr auto 1fr;padding:16px;align-items:center}
  .logo{font-weight:900;color:var(--brown);font-size:36px}
  .title{font-size:52px;font-weight:900;color:var(--brown)}
  .sub{font-size:14px;color:var(--burg);text-transform:uppercase;font-weight:700}
  .qr{position:absolute;left:10%;top:5%;width:70%;height:70%;background:#fff;border:1px solid var(--gold);border-radius:6px;box-shadow:0 0 12px rgba(193,154,51,.4)}
  .fields{position:absolute;right:6%;top:8%;width:48%;font-family:sans-serif;color:var(--brown)}
  .fields b{color:var(--burg)}
  .line{border-top:1px solid var(--brown);margin:10px 0;opacity:.6}
  .waves{position:absolute;left:0;bottom:0;width:100%;height:20px;display:flex;gap:6px}
  .waves>div{flex:1;background:var(--brown);border-radius:3px 3px 0 0}
  .waves>.gold{background:var(--gold)}
  .btntext{color:#fff;font-size:12px;text-align:right}
</style>
</head>
<body>
<div class="ticket">
  <div class="top">
    <div><div class="logo">Arab Kulturfestival</div><div class="sub" style="font-size:16px">Mahragan al-Thaqafa al-Arabiya</div></div>
    <div><div class="title">Eintrittskarte</div></div>
    <div class="logo">Oriental Band Hamburg</div>
  </div>
  <div class="qr"></div>
  <div class="fields">
    <b>AKF-2026-000123</b><br><div class="line"></div>
    <div>Ahmad Alzaher</div><br><div class="line"></div>
    <div>Einladung zur Jahresabschlussfeier 2026</div><br><div class="line"></div>
    <div>04.12.2026 &middot; 18:00 – 21:00</div><br><div class="line"></div>
    <div>Gemeinde St. Markus, Heider Str. 1, 20251 Hamburg-Nord</div><br>
  </div>
</div>
</body>
</html>
