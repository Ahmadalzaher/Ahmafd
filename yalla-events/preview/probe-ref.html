<!doctype html>
<meta charset="utf-8">
<title>ref probe</title>
<style>body{margin:0;background:#111}canvas{display:block;max-width:100%}</style>
<canvas id="c"></canvas>
<script>
const img = new Image();
img.onload = () => {
  const c = document.getElementById('c');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img,0,0);
  window.__ready = true;
  window.__w = c.width; window.__h = c.height;
};
img.src = 'ref-ticket.png';
window.sample = (x,y,w,h) => {
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  const d=ctx.getImageData(Math.max(0,x|0),Math.max(0,y|0),Math.max(1,w|0),Math.max(1,h|0)).data;
  let r=0,g=0,b=0,n=d.length/4;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2]}
  return {r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n),n};
};
window.rowDark = (y) => {
  const c=document.getElementById('c'), ctx=c.getContext('2d');
  const d=ctx.getImageData(0,y|0,c.width,1).data;
  let dark=0; for(let i=0;i<d.length;i+=4){ if((d[i]+d[i+1]+d[i+2])/3 < 235) dark++; }
  return dark/(d.length/4);
};
</script>
