<!doctype html><html><head><meta charset="utf-8"></head><body>
<canvas id="c"></canvas>
<script>
(async () => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'http://127.0.0.1:8765/theme/assets/img/logo-mark.png';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
  const c = document.getElementById('c');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const blob = await new Promise(res => c.toBlob(res, 'image/webp', 0.85));
  const reader = new FileReader();
  reader.onload = async () => {
    const dataUrl = reader.result;
    const resp = await fetch('http://127.0.0.1:8765/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: 'logo-mark.webp', data: dataUrl })
    });
    const result = await resp.json();
    console.log('SAVE_RESULT:', JSON.stringify(result));
    console.log('ORIGINAL_SIZE:', img.naturalWidth, 'x', img.naturalHeight);
  };
  reader.readAsDataURL(blob);
})();
</script>
</body></html>
